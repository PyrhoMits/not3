name: CI — Not3

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  # Match the version required by pubspec.yaml (SDK ^3.13 → Flutter 3.47).
  FLUTTER_VERSION: '3.47.x'

jobs:
  # Fails if any commit (or its history) contains keys, tokens, or credentials.
  # OAuth client IDs and SHA-1 fingerprints are public and are not considered secrets.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (with coverage)
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build-apk:
    name: Build APK (debug)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

  build-linux:
    name: Build Linux
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      # Critical end-to-end flows (welcome → notebook → pen → save) on the
      # desktop app using a virtual display.
      - name: Integration tests (Linux + Xvfb)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" flutter test integration_test -d linux

  release:
    name: Signed release (v* tags)
    if: startsWith(github.ref, 'refs/tags/v')
    # Does not depend on build-linux: its Xvfb integration test is sensitive to
    # the CI environment and must not block publishing a release.
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets are missing (ANDROID_KEYSTORE_BASE64...)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          PROPS

      - name: Install dependencies
        run: flutter pub get

      # The tag must match the version in pubspec.yaml. Release notes come from
      # that version's section in CHANGELOG.md.
      - name: Prepare release notes (CHANGELOG)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml ($PUBSPEC)"
            exit 1
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi
          cat >> release_notes.md <<'NOTES'

          ---
          ## Downloads

          | Platform | File |
          |---|---|
          | Android: recommended if unsure (32+64 bit, works on all devices) | `app-release.apk` |
          | Android (most tablets and phones) | `app-arm64-v8a-release.apk` |
          | Older 32-bit Android devices | `app-armeabi-v7a-release.apk` |
          | Android x86_64 / emulators | `app-x86_64-release.apk` |
          | Linux (portable) | `Not3-x86_64.AppImage` |
          | Linux (folder archive) | `inklus-linux-x64.tar.gz` |

          **Android:** Open the APK. Android will ask you to allow installation from unknown sources. Installing over the previous version preserves your notes.
          **Linux:** `chmod +x Not3-x86_64.AppImage && ./Not3-x86_64.AppImage`.
          NOTES

      - name: Build APK + AAB (release)
        run: |
          flutter build apk --release --split-per-abi
          # Universal 32+64 bit APK: supports devices with a 32-bit userland on
          # an arm64 CPU (the arm64-only APK is rejected as unavailable).
          flutter build apk --release --target-platform android-arm,android-arm64
          flutter build appbundle --release

      - name: Build Linux (release) + AppImage + tar.gz
        run: |
          flutter build linux --release
          BUNDLE=build/linux/x64/release/bundle
          tar -C "$BUNDLE" -czf inklus-linux-x64.tar.gz .
          mkdir -p AppDir/usr/bin
          cp -r "$BUNDLE"/. AppDir/usr/bin/
          cp assets/icon/app_icon.png AppDir/inklus.png
          cat > AppDir/inklus.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Not3
          Comment=Handwritten notes with a stylus
          Exec=inklus
          Icon=inklus
          Categories=Office;Utility;
          DESKTOP
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/inklus" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir Not3-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          name: Not3 ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/app-release.aab
            Not3-x86_64.AppImage
            inklus-linux-x64.tar.gz
